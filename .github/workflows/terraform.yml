name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "envs/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "envs/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]
      action:
        description: "plan or apply"
        required: true
        default: "plan"
        type: choice
        options: [plan, apply]

permissions:
  id-token: write   # required for Azure OIDC login
  contents: read
  pull-requests: write # required to comment the plan on PRs

env:
  TF_VERSION: "1.7.5"
  TF_VAR_postgres_admin_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

jobs:
  # ---------------------------------------------------------------------
  # Static checks + plan. Runs for every PR against every environment so
  # a reviewer can see the blast radius before merge.
  # ---------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
      fail-fast: false
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init -backend-config="envs/${{ matrix.environment }}/backend.hcl" -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform plan \
            -var-file="envs/${{ matrix.environment }}/${{ matrix.environment }}.tfvars" \
            -out="tfplan-${{ matrix.environment }}" \
            -input=false \
            -no-color | tee plan-${{ matrix.environment }}.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan-${{ matrix.environment }}.txt', 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan — ${{ matrix.environment }}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: tfplan-${{ matrix.environment }}
          retention-days: 5

  # ---------------------------------------------------------------------
  # Apply. Only runs on merge to main (auto for dev/staging) or manual
  # dispatch. Prod uses a GitHub Environment with required reviewers, so
  # it needs a human approval click regardless of trigger.
  # ---------------------------------------------------------------------
  apply:
    name: apply (${{ matrix.environment }})
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: >-
          ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev","staging"]') }}
      fail-fast: false
    environment: ${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: terraform init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init -backend-config="envs/${{ matrix.environment }}/backend.hcl" -input=false

      - name: terraform apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform apply -auto-approve \
            -var-file="envs/${{ matrix.environment }}/${{ matrix.environment }}.tfvars" \
            -input=false
